name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Load the permanent signing key
        env:
          KS_B64: ${{ secrets.WEALTHORA_KS_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::WEALTHORA_KS_B64 secret not set - building with a temporary key"
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/wealthora.keystore"
            echo "WEALTHORA_KS=$RUNNER_TEMP/wealthora.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Wealthora.apk

      - name: Save APK on this run
        uses: actions/upload-artifact@v4
        with:
          name: Wealthora-apk
          path: Wealthora.apk

      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.${{ github.run_number }}
          name: Wealthora v2.7.${{ github.run_number }}
          body: Download Wealthora.apk below and open it on your Android phone to install.
          files: Wealthora.apk
