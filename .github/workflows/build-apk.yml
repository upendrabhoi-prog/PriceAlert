name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Wealthora.apk

      - name: Save APK on this run
        uses: actions/upload-artifact@v4
        with:
          name: Wealthora-apk
          path: Wealthora.apk

      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.${{ github.run_number }}
          name: Wealthora v1.7.${{ github.run_number }}
          body: Download Wealthora.apk below and open it on your Android phone to install.
          files: Wealthora.apk
